<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="#{user_management.title}"></title>
    <link rel="stylesheet" th:href="@{/assets/user/list.css}">
</head>
<body>
<main layout:fragment="content">
    <div th:replace="~{user/dialog :: createUserDialog}"></div>

    <div class="wa-container">
        <div class="wa-stack wa-gap-s">
            <div class="wa-cluster wa-align-items-start">
                <h1 class="wa-heading-l" th:text="#{user_management.title}"></h1>
                <wa-button onclick="document.getElementById('create-user-dialog').open = true"
                           th:text="#{user_management.create_user}"
                           th:if="${canCreateUser}">
                </wa-button>

                <wa-button hx-get="/htmx/user/list"
                           hx-target="#user-table-container"
                           hx-swap="innerHTML"
                           th:text="#{user_management.button.refresh}">
                </wa-button>
            </div>

            <!-- Modal Container -->
            <div id="modal-container"></div>

            <wa-card>
                <div class="wa-stack wa-gap-m">
                    <div id="user-table-container" th:fragment="userTable">
                        <wa-progress-bar id="loading-indicator" indeterminate class="htmx-indicator"></wa-progress-bar>

                        <div th:if="${#lists.isEmpty(users)}">
                            <div class="wa-gap-m">
                                <h3 class="wa-heading-m" th:text="#{user_management.no_data_mess}"></h3>
                            </div>
                        </div>

                        <wa-scroller th:unless="${#lists.isEmpty(users)}" orientation="vertical">
                            <table id="dataTable" class="user-table">
                                <thead>
                                <tr>
                                    <th class="r-w-25" th:text="#{user_management.table.email}"></th>
                                    <th class="r-w-20" th:text="#{user_management.table.status}"></th>
                                    <th class="r-w-20" th:text="#{user_management.table.roles}"></th>
                                    <th class="r-w-20" th:text="#{user_management.table.last_login}"></th>
                                    <th th:if="${canCreateUser}" class="r-w-15" th:text="#{user_management.table.action}"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="user : ${users}">
                                    <td>
                                        <span class="wa-body" th:text="${user.email}"></span>
                                    </td>
                                    <td>
                                        <wa-badge th:if="${user.isEnabled}" variant="success" th:text="#{user_management.enabled}"></wa-badge>
                                        <wa-badge th:unless="${user.isEnabled}" variant="warning" th:text="#{user_management.disabled}"></wa-badge>
                                        <wa-badge th:if="${user.isLocked}" variant="danger" th:text="#{user_management.locked}"></wa-badge>
                                    </td>
                                    <td>
                                        <wa-badge th:each="role, iterStat : ${user.tenantRoles}"
                                                  appearance="filled outlined"
                                                  variant="brand"
                                                  th:text="${role.name}">
                                        </wa-badge>
                                    </td>
                                    <td>
                                        <span class="wa-body" th:text="${user.lastLoginAt != null ? #temporals.format(user.lastLoginAt, 'yyyy-MM-dd HH:mm') : 'Never'}">
                                        </span>
                                    </td>
                                    <td>
                                        <wa-button th:hx-get="@{/htmx/user/{id}/edit-modal(id=${user.id})}"
                                                hx-target="#modal-container"
                                                hx-swap="innerHTML"
                                                hx-indicator="#loading-indicator"
                                                th:if="${canCreateUser}"
                                                th:text="#{user_management.button.edit}">
                                        </wa-button>
                                    </td>
                                </tr>
                                </tbody>
                                <tfoot>
                                <tr th:if="${canCreateUser}" class="r-total-row">
                                    <td colspan="5" class="r-amount-cell">
                                        <span th:text="#{user_management.table.foot_title} + ' ' + ${#lists.size(users)}"></span>
                                    </td>
                                </tr>
                                </tfoot>
                            </table>
                        </wa-scroller>
                    </div>
                </div>
            </wa-card>
        </div>
    </div>
</main>

<th:block layout:fragment="scripts">
    <script th:src="@{/assets/user/list.js}"></script>
</th:block>
</body>
</html>
